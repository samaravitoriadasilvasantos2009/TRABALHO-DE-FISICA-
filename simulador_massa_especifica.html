<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Massa Específica</title>
<style>
:root { color-scheme: dark; --blue:#1689ff; --light:#e9f2ff; --muted:#aeb9c8; }
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:#080a0e; color:#f3f6fb; font-family:Arial,Helvetica,sans-serif;
}
.panel {
  width:min(100%,1000px); min-height:430px; display:grid; grid-template-columns:1.05fr .95fr;
  border:1px solid #454b55; border-radius:28px; overflow:hidden;
  background:#202124; box-shadow:0 20px 60px #0008;
}
.controls { padding:34px 38px; display:flex; flex-direction:column; justify-content:center; gap:24px; }
.formula { text-align:center; font-family:Georgia,serif; font-size:30px; font-style:italic; color:#f0f3f8; margin-bottom:8px; }
.fraction { display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin-left:4px; }
.fraction .top { border-bottom:1.5px solid currentColor; padding:0 9px 4px; }
.fraction .bottom { padding-top:4px; }
.result { text-align:center; font-family:Georgia,serif; font-size:24px; color:#e8edf5; }
.result small { color:#aeb9c8; font-size:15px; }
.control { display:grid; grid-template-columns:30px 58px 1fr; gap:12px; align-items:center; }
.symbol { font-family:Georgia,serif; font-style:italic; font-weight:bold; font-size:20px; }
.value { color:#dbe4f0; font-size:14px; white-space:nowrap; }
input[type=range] { width:100%; accent-color:#f4f7fb; cursor:pointer; }
.scene { display:grid; place-items:center; padding:26px; border-left:1px solid #454b55; background:linear-gradient(135deg,#25272b,#1d1f23); }
svg { width:min(100%,360px); height:auto; overflow:visible; }
.note { color:#9ba6b5; font-size:12px; text-align:center; margin-top:-5px; }
@media(max-width:700px) {
 .panel { grid-template-columns:1fr; }
 .scene { border-left:0; border-top:1px solid #454b55; min-height:330px; }
 .controls { padding:28px 24px; }
}
</style>
</head>
<body>
<main class="panel">
  <section class="controls">
    <div class="formula">ρ = <span class="fraction"><span class="top">m</span><span class="bottom">V</span></span></div>
    <div class="result" id="equation">ρ = 10,4 kg / 11,0 L = 0,95 kg/L</div>
    <label class="control">
      <span class="symbol">m</span><span class="value" id="massValue">10,4 kg</span>
      <input id="mass" type="range" min="1" max="20" step="0.1" value="10.4" aria-label="Massa em quilogramas">
    </label>
    <label class="control">
      <span class="symbol">V</span><span class="value" id="volumeValue">11,0 L</span>
      <input id="volume" type="range" min="1" max="20" step="0.5" value="11" aria-label="Volume em litros">
    </label>
    <div class="note">Mova os controles para observar como a massa específica se altera.</div>
  </section>
  <section class="scene" aria-label="Recipiente com água">
    <svg viewBox="0 0 340 390" role="img" aria-label="Recipiente transparente com nível de líquido ajustável">
      <defs>
        <linearGradient id="glass" x1="0" x2="1">
          <stop offset="0" stop-color="#a8c9ed" stop-opacity=".12"/>
          <stop offset=".48" stop-color="#d9eaff" stop-opacity=".03"/>
          <stop offset="1" stop-color="#a8c9ed" stop-opacity=".15"/>
        </linearGradient>
        <linearGradient id="water" x1="0" x2="1">
          <stop offset="0" stop-color="#1479d4" stop-opacity=".42"/>
          <stop offset=".5" stop-color="#398fe9" stop-opacity=".30"/>
          <stop offset="1" stop-color="#1479d4" stop-opacity=".48"/>
        </linearGradient>
        <clipPath id="inside">
          <path d="M70 65 Q70 42 170 42 Q270 42 270 65 L270 322 Q170 365 70 322 Z"/>
        </clipPath>
      </defs>
      <path d="M70 65 Q70 42 170 42 Q270 42 270 65 L270 322 Q170 365 70 322 Z" fill="url(#glass)" stroke="#9ba4b0" stroke-width="1.3"/>
      <g clip-path="url(#inside)">
        <rect id="waterFill" x="70" y="176" width="200" height="190" fill="url(#water)"/>
        <path id="waterSurface" d="M70 176 Q120 183 170 176 Q220 169 270 176" fill="none" stroke="#1689ff" stroke-width="2.5"/>
        <g id="particles" fill="#2d8ef0" opacity=".62"></g>
      </g>
      <path d="M70 65 Q70 42 170 42 Q270 42 270 65" fill="none" stroke="#9ba4b0" stroke-width="1.3"/>
      <path d="M70 322 Q170 365 270 322" fill="none" stroke="#9ba4b0" stroke-width="1.3" stroke-dasharray="3 5" opacity=".8"/>
      <path d="M70 65 L70 322 M270 65 L270 322" fill="none" stroke="#9ba4b0" stroke-width="1.1" opacity=".65"/>
    </svg>
  </section>
</main>
<script>
const mass = document.getElementById('mass');
const volume = document.getElementById('volume');
const massValue = document.getElementById('massValue');
const volumeValue = document.getElementById('volumeValue');
const equation = document.getElementById('equation');
const fill = document.getElementById('waterFill');
const surface = document.getElementById('waterSurface');
const particles = document.getElementById('particles');
const NS = 'http://www.w3.org/2000/svg';
const particlePositions = [
 [95,90],[125,105],[160,88],[205,116],[240,98],[82,150],[112,190],[145,165],
 [178,145],[220,175],[250,150],[100,220],[140,240],[185,210],[230,235],[260,205],
 [120,280],[165,300],[205,275],[245,290],[90,315],[150,330],[220,320],[255,310]
];
particlePositions.forEach(([x,y],i)=>{
 const c=document.createElementNS(NS,'circle');
 c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r', i%4===0 ? 3.8 : 3);
 c.dataset.y=y; particles.appendChild(c);
});
function fmt(n,d=1){ return n.toFixed(d).replace('.',','); }
function update(){
 const m=Number(mass.value), v=Number(volume.value), rho=m/v;
 massValue.textContent=fmt(m)+' kg';
 volumeValue.textContent=fmt(v)+' L';
 equation.textContent='ρ = '+fmt(m)+' kg / '+fmt(v)+' L = '+fmt(rho,2)+' kg/L';
 const top=322-(v/20)*245;
 fill.setAttribute('y',top);
 fill.setAttribute('height',365-top);
 surface.setAttribute('d',`M70 ${top} Q120 ${top+7} 170 ${top} Q220 ${top-7} 270 ${top}`);
 [...particles.children].forEach((c,i)=>{
   const y=Number(c.dataset.y);
   c.style.display = y >= top+10 ? '' : 'none';
 });
}
mass.addEventListener('input',update);
volume.addEventListener('input',update);
update();
</script>
</body>
</html>
